<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
        <script src="../js/cliente_atualizar.js" defer></script>
    <title>Atualizar Cliente</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Cliente</h1>
        <form>
            <label for="id">Código do Cliente</label><br>
            <input type="number" id="id" required><br><br>

            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" required><br><br>

            <label for="senha">Senha</label><br>
            <input type="password" id="senha" required><br><br>

            <label for="cpf">CPF (11 dígitos)</label><br>
            <input type="text" id="cpf" maxlength="11" required><br><br>

            <label for="celular">Celular</label><br>
            <input type="text" id="celular" required><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
